modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/KonradReinhardt/diorama/issues"

[[mods]]
modId = "diorama"
version = "${version}"
displayName = "Mappa Mundi"
description = "A ray-traced, angled voxel map and minimap, painted like an old atlas: a book of settings over the world map, banner waypoints, drifting clouds, coasts and day and night. A fork of Diorama by Dara Adedeji."
authors = "Konrad Reinhardt, Dara Adedeji"
displayURL = "https://github.com/KonradReinhardt/diorama"
logoFile = "assets/diorama/icon.png"

[[mixins]]
config = "diorama.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.diorama]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge}"

[[dependencies.diorama]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
