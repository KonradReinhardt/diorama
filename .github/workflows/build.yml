name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.1', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.9', '1.21.11', '26.1', '26.2', '26.3', '1.21-neoforge', '1.21.1-neoforge', '1.21.3-neoforge', '1.21.4-neoforge', '1.21.5-neoforge', '1.21.8-neoforge', '1.21.10-neoforge', '1.21.11-neoforge', '26.1.2-neoforge', '26.2-neoforge', '26.3-neoforge']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew --configure-on-demand :${{ matrix.minecraft }}:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/reports/
  client-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: map-regressions
            scenarios: directions,settings-refresh,settings,saved-map,radar,waypoints
            modmenu: 'false'
          - name: lighting
            scenarios: day-night
            modmenu: 'false'
          - name: modmenu
            scenarios: modmenu
            modmenu: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - run: xvfb-run -a bash ./gradlew --configure-on-demand -PdioramaModMenuTest=${{ matrix.modmenu }} :26.3:runClientGameTest
        env:
          DIORAMA_TESTS: ${{ matrix.scenarios }}
          LIBGL_ALWAYS_SOFTWARE: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-test-results-${{ matrix.name }}
          path: |
            versions/26.3/build/run/clientGameTest/screenshots/
            versions/26.3/build/run/clientGameTest/logs/
            versions/26.3/build/reports/
